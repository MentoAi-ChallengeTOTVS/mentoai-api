spring:
  application:
    name: mentoai-api

  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    username: ${DB_USERNAME:teste}
    password: ${DB_PASSWORD:a123}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

mentoai:
  ai:
    connect-timeout: ${AI_CONNECT_TIMEOUT:5s}
    read-timeout: ${AI_READ_TIMEOUT:60s}

    gemini:
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      api-key: ${GEMINI_API_KEY:}
      primary-model: ${GEMINI_PRIMARY_MODEL:gemini-3.5-flash-lite}
      fallback-model: ${GEMINI_FALLBACK_MODEL:gemini-3.5-flash}

    groq:
      base-url: ${GROQ_BASE_URL:https://api.groq.com}
      api-key: ${GROQ_API_KEY:}
      model: ${GROQ_MODEL:}